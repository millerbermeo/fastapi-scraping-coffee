services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-scraping-coffee:latest
    container_name: fastapi-scraping-coffee
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"

    volumes:
      - ./app:/app/app:ro
      - ./run.py:/app/run.py:ro

    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host ${APP_HOST:-0.0.0.0} --port ${APP_PORT:-8000} ${UVICORN_RELOAD:+--reload --reload-dir /app/app}
