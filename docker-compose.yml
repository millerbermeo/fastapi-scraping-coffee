# Docker Compose v2 (no `version:` key - obsolete since Compose v2).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-scraping-coffee:latest
    container_name: fastapi-scraping-coffee
    restart: unless-stopped

    # All configuration comes from .env - nothing is hardcoded here.
    env_file:
      - .env

    # Publicado solo en loopback: accesible desde el propio servidor,
    # no desde internet. Cambia a "${APP_PORT:-8000}:${APP_PORT:-8000}"
    # si necesitas exponerlo hacia afuera.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:${APP_PORT:-8000}"

    # Development bind mounts: edit on the host, uvicorn --reload picks it up.
    # Read-only so the container can never write into your working tree.
    volumes:
      - ./app:/app/app:ro
      - ./run.py:/app/run.py:ro

    # Overrides the image CMD to add --reload when UVICORN_RELOAD is set.
    # Leave UVICORN_RELOAD empty in .env to run exactly like the production image.
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host ${APP_HOST:-0.0.0.0} --port ${APP_PORT:-8000} ${UVICORN_RELOAD:+--reload --reload-dir /app/app}

# No database, cache or broker service is defined on purpose:
# the app is stateless (in-memory cachetools.TTLCache in app/deps.py) and its
# only external dependencies are outbound HTTPS calls made with httpx.
